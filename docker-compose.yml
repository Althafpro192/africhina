version: '3.8'

services:
  # 1. Database (MySQL)
  db:
    image: mysql:8.0
    container_name: africhina_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-160907}
      MYSQL_DATABASE: ${DB_NAME:-africhina}
      MYSQL_USER: ${DB_USER:-africhina}
      MYSQL_PASSWORD: ${DB_PASSWORD:-160907}
    volumes:
      - mysqldata:/var/lib/mysql
    networks:
      - africhina_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-160907}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Backend (Laravel PHP-FPM + Nginx)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: africhina_backend
    restart: always
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_NAME:-africhina}
      DB_USERNAME: ${DB_USER:-africhina}
      DB_PASSWORD: ${DB_PASSWORD:-160907}
    volumes:
      # Bind mount uploads for persistent storage during dev
      - ./backend/public/uploads:/var/www/html/public/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - africhina_net
    ports:
      - "5000:80"

  # 3. Frontend (Vue 3 + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: africhina_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - africhina_net

networks:
  africhina_net:
    driver: bridge

volumes:
  mysqldata:

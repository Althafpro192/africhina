; PHP Override Configuration for AfriChina Web
; This file is loaded by Laravel's development server

; Increase upload limits to support base64-encoded images and videos
; Base64 encoding increases file size by ~33%, so 5MB image becomes ~6.5MB
upload_max_filesize = 50M
post_max_size = 128M
memory_limit = 256M
max_execution_time = 300

; Disable realpath cache for development
realpath_cache_ttl = 0
